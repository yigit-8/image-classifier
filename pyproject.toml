[project]
name = "image-classifier"
version = "0.1.0"
description = "CIFAR-10 image classification service with a PyTorch CNN"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "PL"]
# PLR0913: model and training functions legitimately take many hyperparameters
# PLR2004: status codes in tests and tensor dimensions are self-explanatory
# PLW0603: module-level model handle loaded at startup is the standard FastAPI pattern
# N806: X / X_train naming is the ML convention
# N812: torch.nn.functional imported as F is the standard PyTorch convention
# PLW2901: rebinding the batch in "images = images.to(device)" is the standard PyTorch loop pattern
ignore = ["PLR0913", "PLR2004", "PLW0603", "N806", "N812", "PLW2901"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/"]
