name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      - name: Lint
        run: ruff check src tests

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t image-classifier:${{ github.sha }} .

      # The image is only worth pushing if it actually boots and serves.
      # /health needs a checkpoint, so bake a randomly initialised one into a
      # throwaway layer on top of the built image (it already has torch).
      - name: Smoke test the image
        run: |
          set -eo pipefail
          docker build -t image-classifier-smoke:${{ github.sha }} - <<'EOF'
          FROM image-classifier:${{ github.sha }}
          RUN python -c "import torch; from src.model import ImageClassifier; torch.save(ImageClassifier().state_dict(), 'data/model.pt')"
          EOF
          docker run -d --name smoke -p 8000:8000 image-classifier-smoke:${{ github.sha }}
          deadline=$((SECONDS + 60))
          until curl -fsS http://localhost:8000/health; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "container did not become healthy within 60s"
              docker logs smoke
              docker rm -f smoke
              exit 1
            fi
            sleep 2
          done
          echo
          echo "container is healthy"
          docker rm -f smoke

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to GHCR
        if: github.event_name == 'push'
        run: |
          docker tag image-classifier:${{ github.sha }} ghcr.io/yigitliman/image-classifier:latest
          docker tag image-classifier:${{ github.sha }} ghcr.io/yigitliman/image-classifier:${{ github.sha }}
          docker push ghcr.io/yigitliman/image-classifier:latest
          docker push ghcr.io/yigitliman/image-classifier:${{ github.sha }}
